<div id="four-pages" class="viz-dotted-background">
<style>
#four-pages{font-family:system-ui,sans-serif;color:light-dark(#222938,#eceef5);padding:24px 0;--p:light-dark(#fff,#222630);--l:light-dark(#d8dce6,#454b5a);--s:light-dark(#eef0f6,#343a48);--a:light-dark(#465ddd,#a8b5ff)}#four-pages .row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:26px}#four-pages .mini{border:1px solid var(--l);border-radius:14px;background:var(--p);padding:20px 4px;text-align:center;font-size:12px}#four-pages .selected{outline:2px solid var(--a);outline-offset:-2px}#four-pages .line{height:6px;background:var(--s);margin:14px 10px;border-radius:4px}#four-pages .phone{background:var(--p);border:2px solid var(--l);border-radius:30px;padding:20px;width:min(310px,100%);box-sizing:border-box;margin:auto;touch-action:pan-y}#four-pages .status{font-size:12px;display:flex;justify-content:space-between}#four-pages .content{height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}#four-pages .number{font-size:56px;color:var(--a)}#four-pages .block{height:42px;width:100%;background:var(--s);border-radius:10px}#four-pages .nav{display:flex;align-items:center;justify-content:space-between}#four-pages button{padding:10px 16px;border:1px solid var(--l);background:var(--p);color:inherit;border-radius:10px;font:inherit;cursor:pointer}#four-pages button:disabled{opacity:.3}#four-pages .hint{text-align:center;font-size:12px;margin-top:16px}
</style>
<div class="row" aria-label="4개 페이지의 수평 배치"><div class="mini selected">페이지 1<div class="line"></div><div class="line"></div>↔</div><div class="mini">페이지 2<div class="line"></div><div class="line"></div>↔</div><div class="mini">페이지 3<div class="line"></div><div class="line"></div>↔</div><div class="mini">페이지 4<div class="line"></div><div class="line"></div>끝</div></div>
<div class="phone"><div class="status"><span>9:41</span><span>캠퍼스 공지</span></div><div class="content" aria-live="polite"><div class="number">01</div><strong class="title">페이지 1</strong><div class="block"></div><div class="block"></div></div><div class="nav"><button class="prev" aria-label="이전 페이지">←</button><span class="position">● ○ ○ ○</span><button class="next" aria-label="다음 페이지">→</button></div></div>
<div class="hint">좌우 스와이프 · 화살표로 이동</div>
<script>
(()=>{const r=document.getElementById('four-pages');let p=0,x=null;function render(){r.querySelector('.number').textContent='0'+(p+1);r.querySelector('.title').textContent='페이지 '+(p+1);r.querySelector('.position').textContent=Array.from({length:4},(_,i)=>i===p?'●':'○').join(' ');r.querySelectorAll('.mini').forEach((el,i)=>el.classList.toggle('selected',p===i));r.querySelector('.prev').disabled=p===0;r.querySelector('.next').disabled=p===3}function move(d){p=Math.max(0,Math.min(3,p+d));render()}r.querySelector('.prev').onclick=()=>move(-1);r.querySelector('.next').onclick=()=>move(1);const phone=r.querySelector('.phone');phone.onpointerdown=e=>x=e.clientX;phone.onpointerup=e=>{if(x!==null&&Math.abs(e.clientX-x)>40)move(e.clientX<x?1:-1);x=null};phone.onpointercancel=()=>x=null;render()})();
</script>
</div>
